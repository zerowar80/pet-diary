{% extends "base.html" %}
{% block title %}계정 설정{% endblock %}
{% block content %}
<section class="page narrow">
  <a class="back-link" href="/">&larr; 전체 앨범</a>
  <h1>계정 설정</h1>
  <p class="sub">{{ user['username'] }}으로 로그인 중</p>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  {% if success %}
  <p class="notice">비밀번호가 변경됐어요.</p>
  {% endif %}

  <form class="upload-form" action="/account" method="post">
    <label for="current_password">현재 비밀번호</label>
    <input type="password" id="current_password" name="current_password" required />

    <label for="new_password">새 비밀번호</label>
    <input type="password" id="new_password" name="new_password" placeholder="4자 이상" required />

    <label for="new_password_confirm">새 비밀번호 확인</label>
    <input type="password" id="new_password_confirm" name="new_password_confirm" required />

    <button type="submit">비밀번호 변경</button>
  </form>
</section>
{% endblock %}
